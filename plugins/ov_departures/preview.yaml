# What tools/preview.py shows (docs/PREVIEW.md): a stop with three lines, its answer in OVapi's own shape. The moments
# are made from the time of the render ("{now+4m}"), so the countdown never runs out.
tiles:
  - tile: next
    name: Centraal Station
    options: { stop: "30005002" }
  - tile: next
    name: Line 2 only
    options: { stop: "30005002", line: "2", walk: 3 }
    sizes: [2x1]

answers:
  departures:
    "30005002":
      Stop: { TimingPointName: "Centraal Station", TimingPointTown: "Utrecht" }
