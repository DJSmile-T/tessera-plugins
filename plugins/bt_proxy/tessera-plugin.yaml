# Bluetooth proxy: ESPHome's Bluetooth proxy on the screen, so Home Assistant reaches Bluetooth devices near it (sensors,
# locks, presence with Bermuda) through the screen. It needs a board with Bluetooth and the memory to run it beside the
# screen, the feature `bluetooth`: every ESP32-P4 board brings it through its ESP32-C6, no other board does. That
# follows the board's hardware, so a new P4 board fits without this file changing. The C6 does Wi-Fi and Bluetooth on
# one radio: a setting turns the proxy off without a build.
id: bt_proxy
version: 0.2.0
api: "0.8"
icon: bluetooth
maintainer: MaxGramser
license: MIT
stage: beta
topics: [home]
requires:
  esphome: 2026.6.2
  features: [bluetooth]
boards: any
flash_kb: 380

# The switch of plugin.yaml, also in the plugin's details on the screen's Plugins tab and on the screen's settings page.
settings:
  - { key: bluetooth_proxy, label: setting_proxy, hint: setting_proxy_hint }

# The C6's firmware update in Home Assistant, ticked by default: Bluetooth needs a recent C6 firmware. Nothing installs
# until someone presses Install.
parts:
  - { id: c6_update, file: parts/c6_update.yaml, label: part_c6, hint: part_c6_hint, flash_kb: 200, default: true }
