# What a screen gets when it takes this plugin: ESPHome's Bluetooth proxy, as a ready-made ESPHome Bluetooth proxy has
# it, and a switch to turn Bluetooth off and on again without a build.
#
# On an ESP32-P4 the Bluetooth stack runs on the P4 and the radio is the ESP32-C6 that also does the Wi-Fi (ESPHome
# picks this by itself when there is an esp32_hosted block, which every P4 board has). One radio for both: every moment
# it listens for Bluetooth is a moment without Wi-Fi. The scan below is ESPHome's default, 30 ms of every 320 ms, the
# setting ESPHome's own Wi-Fi proxies keep so the two can share the radio. Do not raise the window to the interval: a
# proxy that listens all the time takes the Wi-Fi a screen needs for its pictures and camera streams.
esp32_ble_tracker:
  scan_parameters:
    interval: 320ms
    window: 30ms
    active: true

# Active: Home Assistant may also connect to a device through the screen (a lock, a plant sensor), up to three at a time.
bluetooth_proxy:
  active: true

# Off stops Bluetooth altogether, so the radio is the Wi-Fi's alone; on starts it again. Kept across a restart.
switch:
  - platform: template
    id: bt_proxy_on
    name: "Bluetooth proxy"
    icon: mdi:bluetooth
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - ble.enable:
    turn_off_action:
      - ble.disable:

# What the proxy is doing, in the screen's language: listening, off, starting, or that Bluetooth did not start because
# the C6 firmware is too old (ESPHome marks its Bluetooth failed then). On the screen's settings page too.
text_sensor:
  - platform: template
    id: bt_proxy_status
    name: "Bluetooth status"
    icon: mdi:bluetooth-settings
    entity_category: diagnostic

bt_proxy:
  proxy_on: bt_proxy_on
  status: bt_proxy_status
